spring.application.name=siakad-ai
server.port=8080

# Model AI yang dipakai: implementasi MockChatModel & MockEmbeddingModel (offline, tanpa API key).
# Untuk berpindah ke LLM sungguhan cukup tambahkan starter (mis. spring-ai-starter-model-ollama
# atau spring-ai-starter-model-openai) dan hapus bean mock di AiConfig.
siakad.ai.model=mock-rule-based-v1

# Batas upload dokumen RAG
spring.servlet.multipart.max-file-size=5MB

# Logging prompt & response (SimpleLoggerAdvisor)
logging.level.org.springframework.ai.chat.client.advisor=DEBUG
